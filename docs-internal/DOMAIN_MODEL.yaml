# yaml-language-server: $schema=../docs/class-model/v0.1/schema.json

title: Domain Model of @fal-works/conceptual-model
description: |-
  This model defines the core domain concepts and their structural relationships 
  within the @fal-works/conceptual-model library's problem domain.

  It models the essential entities (Model, Schema, Process, etc.) and components 
  (StringPipeline, Parser, Validator, Converter) that form the conceptual foundation 
  of the library.

  Excluded from this model:
  - Implementation details and code structure
  - Runtime behavior and data flow
  - User interface and API design

  Focus: Static domain structure and concept relationships.

layout:
  direction: TB

nodes:
  # User-facing concepts
  Model:
    label: "Model\n(User Data)"
    attributes:
      - nodes
      - edges

  Schema:
    label: "Schema\n(JSON Schema)"

  # Core processing concepts
  Process:
    label: "Process\n(Schema + Converter)"

  StringPipeline: null

  # Pipeline components
  Parser:
    attributes:
      - inputFileFormat

  Validator: null

  Converter: null

edges:
  # Schema relationships
  - source: Schema
    relation: to
    label: constrains
    target: Model

  - source: Schema
    relation: to
    label: compiles to
    target: Validator

  # Process aggregation
  - source: Process
    relation: aggregates
    label: includes
    target: Schema
    multiplicity: "1"

  - source: Process
    relation: aggregates
    label: includes
    target: Converter
    multiplicity: "1"

  # StringPipeline structural relationships
  - source: StringPipeline
    relation: refers-to
    label: uses
    target: Parser

  - source: StringPipeline
    relation: refers-to
    label: uses
    target: Process
