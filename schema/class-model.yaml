# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#
$schema: http://json-schema.org/draft-07/schema#
$id: https://fal-works.github.io/conceptual-model/class-model/v0.1/schema.json
title: "@fal-works/conceptual-model | Conceptual class model schema"
description: |-
  Schema for defining conceptual class models that can also be represented as UML class diagrams.
  https://github.com/fal-works/conceptual-model
type: object
properties:
  $schema:
    title: JSON schema URL
    type: string
    description: |-
      JSON Schema reference for validating this model.
      e.g. https://fal-works.github.io/conceptual-model/class-model/v0.1/schema.json
  title:
    title: Model title
    type: string
    description: Title of this model.
  description:
    title: Model description
    type: string
    description: Description of this model.
  groups:
    title: Model groups
    type: object
    description: Collection of groups for organizing nodes. Each key is a unique group identifier.
    additionalProperties:
      $ref: "#/definitions/group"
  nodes:
    title: Model nodes
    type: object
    description: Collection of nodes representing classes, entities, or concepts in the model. Each key is a unique node identifier.
    additionalProperties:
      $ref: "#/definitions/node"
  edges:
    title: Model edges
    type: array
    description: List of edges representing relationships, associations, or connections between nodes/classes in the conceptual model
    items:
      $ref: "#/definitions/edge"
  layout:
    $ref: "#/definitions/layout"
additionalProperties: true
definitions:
  group:
    title: Model group
    type: object
    description: A group for organizing related nodes in the model.
    properties:
      label:
        title: Group label
        type: string
        description: Display name for this group. Can contain \n for line breaks. If omitted, the node key will be used as display name.
      nodes:
        title: Group nodes
        type: array
        description: List of node identifiers (keys) that belong to this group.
        items:
          type: string
    required:
      - nodes
    additionalProperties: false
  node:
    title: Model node
    description: A single class, entity, or concept in the model.
    oneOf:
      - type: object
        properties:
          label:
            title: Node label
            type: string
            description: Display name for this node/class. Can contain \n for line breaks. If omitted, the node key will be used as display name.
          attributes:
            title: Node attributes
            type: array
            description: List of attributes.
            items:
              type: string
        additionalProperties: false
      - type: "null"
  edge:
    title: Model edge
    type: object
    description: A single edge representing relationship, association, or connection between two nodes/classes in this model.
    additionalProperties: false
    properties:
      source:
        title: Source node
        type: string
        description: Identifier (key) of the source node/class.
      relation:
        $ref: "#/definitions/relation"
      label:
        title: Edge label
        type: string
        description: Optional label for this association.
      multiplicity:
        $ref: "#/definitions/multiplicity"
      target:
        title: Target node
        type: string
        description: Identifier (key) of the target node/class.
    required:
      - source
      - target
  relation:
    title: Relationship type
    type: string
    description: |-
      Type of relationship/association between the nodes/classes:
      - is-a: Generalization/inheritance
      - is-composed-of: Composition (ownership with lifecycle dependency)
      - aggregates: Aggregation (weak ownership without lifecycle dependency)
      - refers-to: Reference, or navigable association (can reach the target node but does not own it)
      - to: General directional association (use when other types are not appropriate)
      - with: General bidirectional/nondirectional association (use when other types are not appropriate)
    enum:
      - is-a
      - is-composed-of
      - aggregates
      - refers-to
      - to
      - with
  multiplicity:
    title: Multiplicity
    type: string
    description: |-
      Either:
      - Multiplicity on target side (e.g. '1', '0..1', '1..*', '0..*')
      - Multiplicity on both sides (e.g. '1 -> *', '0..1 => 0..*')
    pattern: '^(0|1|\*|[0-9]+)(\.\.(0|1|\*|[0-9]+))?( *-> *(0|1|\*|[0-9]+)(\.\.(0|1|\*|[0-9]+))?)?$'
  layout:
    title: Layout Preferences
    type: object
    description: Layout preferences used for rendering the model as a diagram.
    properties:
      direction:
        title: Layout direction
        type: string
        description: Direction of the diagram layout, e.g. TB (top to bottom), LR (left to right).
        enum: ["TB", "BT", "LR", "RL"]
    additionalProperties: false
